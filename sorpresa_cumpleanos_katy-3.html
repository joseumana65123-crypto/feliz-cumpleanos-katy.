<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 24px 14px; overflow-x: hidden;
    background: radial-gradient(circle at top, #fff7fb, #ffd5e7 55%, #ffb6d2);
    font-family: Georgia, serif; color: #70213f;
  }
  .card {
    width: min(760px, 100%); text-align: center; padding: 30px 18px;
    border: 3px solid #fff; border-radius: 28px;
    background: rgba(255,255,255,.76);
    box-shadow: 0 16px 45px rgba(159,48,93,.18);
  }
  .hearts { font-size: 28px; letter-spacing: 10px; }
  h1 { margin: 12px 0 8px; font-size: clamp(2rem, 8vw, 4rem); color: #e83e83; }
  p { font-size: 1.12rem; line-height: 1.5; }
  button {
    border: 0; border-radius: 999px; padding: 16px 32px; margin: 14px 0;
    background: linear-gradient(135deg, #ff5b9b, #e52e79); color: white;
    font-size: 1.25rem; font-weight: bold; cursor: pointer;
    box-shadow: 0 7px 0 #b92560, 0 12px 25px #e83e8344;
  }
  button:active { transform: translateY(3px); box-shadow: 0 4px 0 #b92560; }
  #surprise { display: none; animation: appear .9s ease both; }
  #surprise img {
    display: block; width: 100%; height: auto; border-radius: 18px;
    border: 5px solid white; box-shadow: 0 8px 28px #8f31552b;
  }
  .wish { font-size: 1.2rem; color: #8e2852; margin: 18px auto 4px; }
  .small { font: 0.9rem Arial, sans-serif; color: #9a5270; }
  @keyframes appear { from {opacity:0; transform:translateY(16px) scale(.98)} to {opacity:1; transform:none} }
  .float { position: fixed; pointer-events:none; opacity:.7; animation: drift 7s linear infinite; }
  @keyframes drift { from { transform:translateY(105vh) rotate(0deg); } to { transform:translateY(-15vh) rotate(25deg); } }
</style>

    <p class="wish">Disfruta mucho tu día. ¡Te queremos! 🎂💕</p>
    <button id="musicBtn" type="button">♫ Pausar música</button>
    <p class="small">Puedes tocar el botón para pausar o volver a escuchar la melodía.</p>
  </section>
</main>
<script>
let audioCtx = null, timer = null, noteIndex = 0, playing = false;
const notes = [523.25,659.25,783.99,659.25,587.33,698.46,880,783.99,659.25,587.33,523.25,392];
function playNote(freq, start) {
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.type = "sine"; osc.frequency.value = freq;
  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(0.10, start + 0.03);
  gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.42);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(start); osc.stop(start + 0.45);
}
function startMusic() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  audioCtx.resume();
  playing = true;
  timer = setInterval(() => {
    if (!playing) return;
    playNote(notes[noteIndex % notes.length], audioCtx.currentTime);
    if (noteIndex % 4 === 0) playNote(notes[(noteIndex + 2) % notes.length] / 2, audioCtx.currentTime);
    noteIndex++;
  }, 470);
  document.getElementById("musicBtn").textContent = "♫ Pausar música";
}
function stopMusic() {
  playing = false;
  if (timer) clearInterval(timer);
  timer = null;
  document.getElementById("musicBtn").textContent = "♫ Reproducir música";
}
document.getElementById("openBtn").addEventListener("click", () => {
  document.getElementById("surprise").style.display = "block";
  document.getElementById("openBtn").style.display = "none";
  startMusic();
});
document.getElementById("musicBtn").addEventListener("click", () => {
  if (playing) stopMusic(); else startMusic();
});
</script>
